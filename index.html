<!DOCTYPE html>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5h15v1.6h-15V19.5Zm1.7-2.2H4.5V9.8h1.7v7.5Zm4.3 0H8.8V5.8h1.7v11.5Zm4.3 0h-1.7V11h1.7v6.3Zm4.3 0h-1.7V4.2h1.7v13.1Z"/></svg>
